<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Asset Packager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
    <div class="max-w-4xl mx-auto py-16 px-4">
        <header class="text-center mb-12">
            <h1 class="text-4xl font-bold mb-4">📦 Digital Asset Packager</h1>
            <p class="text-slate-600">Turn raw text into professional PDF & EPUB e-books instantly.</p>
        </header>

        <div class="bg-white shadow-xl rounded-2xl p-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Book Title</label>
                        <input id="title" type="text" placeholder="e.g. The SaaS Blueprint" class="w-full p-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Author Name</label>
                        <input id="author" type="text" placeholder="Your Name" class="w-full p-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Content (Markdown/Text)</label>
                        <textarea id="text" rows="12" placeholder="# My Book... " class="w-full p-2 border rounded-lg font-mono text-sm"></textarea>
                    </div>
                </div>

                <div class="bg-slate-100 p-6 rounded-xl space-y-6">
                    <h3 class="text-lg font-semibold">Packaging Settings</h3>
                    <div>
                        <label class="block text-sm font-medium mb-2">Visual Theme</label>
                        <select id="theme" class="w-full p-2 border rounded-lg bg-white">
                            <option value="minimalist">✨ Clean Minimalist</option>
                            <option value="professional">💼 Professional Bold</option>
                        </select>
                    </div>
                    <div class="p-4 bg-blue-50 border border-blue-100 rounded-lg text-sm text-blue-700">
                        <strong>Pro Tip:</strong> Use # for headers and **bold** for emphasis in your text.
                    </div>
                    <button id="packBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition duration-200">
                        Package Assets 🚀
                    </button>
                    <div id="results" class="hidden space-y-3 pt-4">
                        <p class="text-center text-sm font-medium">Your assets are ready!</p>
                        <a id="pdfLink" href="#" class="block w-full text-center bg-white border border-slate-300 py-2 rounded-lg hover:bg-slate-50">📄 Download PDF</a>
                        <a id="epubLink" href="#" class="block w-full text-center bg-white border border-slate-300 py-2 rounded-lg hover:bg-slate-50">📖 Download EPUB</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
